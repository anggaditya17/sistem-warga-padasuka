<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Informasi Warga - RW 03 Padasuka</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden">
        
        <div class="p-8 text-center bg-blue-600">
            <div class="w-20 h-20 bg-white rounded-full mx-auto mb-4 flex items-center justify-center shadow-md">
                <span class="text-blue-600 font-bold text-xl">RW 03</span>
            </div>
            <h1 class="text-white text-2xl font-bold">RW 03 Padasuka</h1>
            <p class="text-blue-100 text-sm">Sistem Informasi Warga Digital</p>
        </div>

        <div class="p-8">
            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-semibold mb-2">Nomor WhatsApp</label>
                <input type="text" placeholder="Contoh: 08123456xxx" 
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                <p class="text-xs text-gray-500 mt-1 italic">* Gunakan nomor yang terdaftar di data warga</p>
            </div>

            <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-300 shadow-lg">
                Kirim OTP
            </button>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">Belum terdaftar? 
                    <a href="#" class="text-blue-600 font-semibold hover:underline">Gunakan Nomor KK</a>
                </p>
            </div>
        </div>
    </div>

    <footer class="mt-8 text-center text-gray-500 text-sm">
        <p>Kecamatan Cimahi Tengah, Kota Cimahi</p>
    </footer>

</body>
</html>
