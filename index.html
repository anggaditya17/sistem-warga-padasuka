<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RW 03 Padasuka | Super App</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background:#f6f7fb; }
.card { background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.06); }
</style>
</head>

<body class="min-h-screen">

<!-- HEADER -->
<div class="bg-green-600 text-white px-6 pt-8 pb-10 rounded-b-[30px] shadow-lg">
  <h1 class="text-2xl font-semibold">Halo, Warga 👋</h1>
  <p class="text-sm opacity-90">RW 03 Padasuka Digital System</p>

  <!-- SEARCH -->
  <div class="mt-4">
    <input type="text" placeholder="Cari layanan..." class="w-full px-4 py-3 rounded-xl text-black outline-none">
  </div>
</div>

<!-- MAIN -->
<div class="px-4 -mt-8 space-y-6">

<!-- QUICK ACTION -->
<div class="card p-4">
  <div class="grid grid-cols-4 gap-4 text-center text-sm">
    <div>
      <div class="bg-green-100 text-green-600 p-3 rounded-xl">🏠</div>
      <p class="mt-2">Data Warga</p>
    </div>
    <div>
      <div class="bg-blue-100 text-blue-600 p-3 rounded-xl">💳</div>
      <p class="mt-2">Iuran</p>
    </div>
    <div>
      <div class="bg-yellow-100 text-yellow-600 p-3 rounded-xl">📢</div>
      <p class="mt-2">Info RW</p>
    </div>
    <div>
      <div class="bg-red-100 text-red-600 p-3 rounded-xl">🚨</div>
      <p class="mt-2">Lapor</p>
    </div>
  </div>
</div>

<!-- LOGIN CARD -->
<div class="card p-6">
  <h2 class="text-xl font-semibold mb-4">Masuk ke Sistem</h2>

  <div class="space-y-3">
    <input type="text" placeholder="Nomor WhatsApp" class="w-full px-4 py-3 rounded-xl bg-gray-100 outline-none">
    <button class="w-full bg-green-600 text-white py-3 rounded-xl font-medium">Kirim OTP</button>
  </div>

  <div class="mt-4 text-center">
    <button onclick="toggleKK()" class="text-sm text-green-600">Gunakan Nomor KK</button>
  </div>

  <div id="kkBox" class="hidden mt-4">
    <input type="text" placeholder="Nomor KK" class="w-full px-4 py-3 rounded-xl bg-gray-100">
    <button class="w-full mt-3 bg-black text-white py-3 rounded-xl">Verifikasi</button>
  </div>
</div>

<!-- INFO CARD -->
<div class="card p-4">
  <h3 class="font-semibold mb-2">Pengumuman Terbaru</h3>
  <p class="text-sm text-gray-500">Kerja bakti hari Minggu pukul 07.00 WIB. Wajib hadir.</p>
</div>

</div>

<!-- BOTTOM NAV -->
<div class="fixed bottom-0 left-0 right-0 bg-white border-t py-3 px-6 flex justify-between text-xs">
  <div class="text-green-600">🏠<br>Home</div>
  <div>📋<br>Layanan</div>
  <div>🔔<br>Notif</div>
  <div>👤<br>Akun</div>
</div>

<script>
function toggleKK(){
  document.getElementById('kkBox').classList.toggle('hidden');
}
</script>

</body>
</html>
