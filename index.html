<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RW 03 Padasuka | Login OTP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
body { font-family: 'Inter', sans-serif; background:#f5f5f7; }
.card { background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.06); }
</style>
</head>

<body class="min-h-screen flex items-center justify-center">

<div class="card p-6 w-full max-w-md">
  <h2 class="text-xl font-semibold mb-4">Login OTP Warga</h2>

  <input id="phone" type="text" placeholder="+62812xxxx" class="w-full px-4 py-3 rounded-xl bg-gray-100 mb-3">
  <div id="recaptcha"></div>

  <button onclick="sendOTP()" class="w-full bg-black text-white py-3 rounded-xl">Kirim OTP</button>

  <div id="otpSection" class="hidden mt-4">
    <input id="otp" type="text" placeholder="Masukkan OTP" class="w-full px-4 py-3 rounded-xl bg-gray-100 mb-3">
    <button onclick="verifyOTP()" class="w-full bg-black text-white py-3 rounded-xl">Verifikasi</button>
  </div>

  <p id="status" class="text-sm text-gray-500 mt-3"></p>
</div>

<script>
// 🔥 GANTI DENGAN CONFIG FIREBASE LO
const firebaseConfig = {
  apiKey: "AIzaSyCzf9UqhqZE3PaStz0gA6Nmi7Vs2gLuv3Y",
  authDomain: "rw-padasuka-jajan.firebaseapp.com",
  projectId: "rw-padasuka-jajan",
  storageBucket: "rw-padasuka-jajan.firebasestorage.app",
  messagingSenderId: "997481012579",
  appId: "1:997481012579:web:053b88b7efa4e2472cc756"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha', {
  size: 'normal'
});

let confirmationResult;

function sendOTP() {
  const phoneNumber = document.getElementById('phone').value;

  auth.signInWithPhoneNumber(phoneNumber, window.recaptchaVerifier)
    .then((result) => {
      confirmationResult = result;
      document.getElementById('otpSection').classList.remove('hidden');
      document.getElementById('status').innerText = 'OTP dikirim!';
    })
    .catch((error) => {
      document.getElementById('status').innerText = error.message;
    });
}

function verifyOTP() {
  const code = document.getElementById('otp').value;

  confirmationResult.confirm(code)
    .then((result) => {
      const user = result.user;
      document.getElementById('status').innerText = 'Login berhasil! UID: ' + user.uid;
      // 👉 redirect ke dashboard
      window.location.href = '/dashboard.html';
    })
    .catch((error) => {
      document.getElementById('status').innerText = 'OTP salah';
    });
}
</script>

</body>
</html>
